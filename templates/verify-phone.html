<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head-common"}}
    {{template "meta-noindex"}}
    <title>Verify Phone - {{brandName}}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/account.css">
</head>

<body>

<header class="account-header">
    <div class="header-inner">
        <a href="/menu" class="logo"><img src="/static/img/enie-mark.svg" alt="{{brandName}}" class="site-logo"> <span>{{brandName}}</span></a>
        <nav aria-label="Main navigation"><a href="/menu">Menu</a><a href="/vendors">Shops</a><a href="/favorites">Favourites</a><a href="/orders">My Orders</a><a href="/loyalty">Rewards</a><a href="/cart" class="cart-link">🛒 Cart</a><a href="/messages">Messages</a><a href="/account" class="active active-link" aria-current="page">Account</a><a href="/help">Help &amp; Support</a><a href="/logout">Logout</a></nav>
    </div>
</header>

<main class="account-container">

    <section class="account-card">

        <h1>Verify Your Phone</h1>
        <p class="verify-subtext">We sent a 6-digit code to <strong>{{.Phone}}</strong>. Enter it below to confirm.</p>

        <form action="/account/phone/verify-otp" method="post" class="profile-form">
            <input type="hidden" name="phone" value="{{.Phone}}">
            <input type="hidden" name="pin_id" value="{{.PinID}}">

            <label for="code">Verification Code</label>
            <input type="text" id="code" name="code" class="code-input" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required autofocus>

            <div class="profile-buttons">
                <button type="submit">Verify &amp; Save</button>
                <a href="/account/edit">Cancel</a>
            </div>
        </form>

    </section>

</main>

<script src="/static/js/notification-bell.js"></script>
<script src="/static/js/nav-active.js"></script>
{{template "scripts-common"}}
</body>
</html>
