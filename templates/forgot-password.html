<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head-common"}}
    {{template "meta-noindex"}}
    <title>Forgot Password - {{brandName}}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>

<body data-nm="public">
    <main>
        <div class="auth-wrapper">
            <h1>Forgot Password</h1>
            <p class="auth-subtext">Enter your email and we'll send you a link to reset your password.</p>

            <form action="/forgot-password" method="post" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
                    <p class="field-error" id="email-error" aria-live="polite"></p>
                </div>

                <button type="submit">Send Reset Link</button>
            </form>

            <p class="auth-footer">
                Remembered your password? <a href="/login">Login</a>
            </p>

            <a href="/" class="back-link">← Back to Home</a>
        </div>
    </main>

    <script src="/static/js/pages/forgot-password.js"></script>
{{template "scripts-common"}}
</body>
</html>
