<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - {{brandName}}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>

<body>
    <main>
        <div class="auth-wrapper">
            <h1>Forgot Password</h1>
            <p class="auth-subtext">Enter your email and we'll send you a link to reset your password.</p>

            <form action="/forgot-password" method="post" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required>
                    <p class="field-error" id="email-error" aria-live="polite"></p>
                </div>

                <button type="submit">Send Reset Link</button>
            </form>

            <p class="auth-footer">
                Remembered your password? <a href="/login">Login</a>
            </p>

            <a href="/" class="back-link">← Back to Home</a>
        </div>
    </main>

    <script>
    (function () {
        var emailEl = document.getElementById('email');
        var msg = document.getElementById('email-error');
        var submitBtn = document.querySelector('form button[type="submit"]');

        function ok(v) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
        }

        function show() {
            var bad = emailEl.value !== '' && !ok(emailEl.value);
            msg.textContent = bad ? 'Enter a valid email address' : '';
            emailEl.classList.toggle('invalid', bad);
        }

        function refresh() {
            submitBtn.disabled = !ok(emailEl.value);
        }

        emailEl.addEventListener('input', function () { show(); refresh(); });
        emailEl.addEventListener('blur', show);
        emailEl.addEventListener('change', refresh);
        refresh();
        setTimeout(refresh, 300);
    })();
    </script>
</body>
</html>
