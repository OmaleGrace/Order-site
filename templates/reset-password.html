<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head-common"}}
    {{template "meta-noindex"}}
    <title>Reset Password - {{brandName}}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>

<body>
    <main>
        <div class="auth-wrapper">
            <h1>Reset Your Password</h1>

            <form action="/reset-password" method="post" novalidate>
                <input type="hidden" name="token" value="{{.Token}}">

                <div class="form-group password-field">
                    <label for="password">New Password</label>
                    <input type="password" name="password" id="password" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="password">Show</button>
                    <p class="field-error" id="password-error" aria-live="polite"></p>
                </div>

                <div class="form-group">
                    <label for="confirm">Confirm New Password</label>
                    <input type="password" id="confirm" autocomplete="new-password" required>
                    <p class="field-error" id="confirm-error" aria-live="polite"></p>
                </div>

                <button type="submit">Reset Password</button>
            </form>

            <a href="/login" class="back-link">← Back to Login</a>
        </div>
    </main>

    <script src="/static/js/pages/reset-password.js"></script>
{{template "scripts-common"}}
</body>
</html>
