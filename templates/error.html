<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head-common"}}
    <title>{{.Title}} - {{brandName}}</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/error.css">
</head>

<body>
    <main>
        <div class="error-wrapper" role="alert">
            <div class="error-code" aria-hidden="true">{{.Code}}</div>
            <h1>{{.Title}}</h1>
            <p>{{.Message}}</p>

            <div class="error-actions">
                {{if .NeedsLogin}}
                <a href="/login" class="error-home-link">Log in</a>
                <a href="/" class="error-secondary-link">Back to Home</a>
                {{else}}
                <a href="/" class="error-home-link">← Back to Home</a>
                {{if .CanRetry}}<button type="button" class="error-secondary-link" data-reload>Try again</button>{{end}}
                <button type="button" class="error-secondary-link" data-go-back hidden>Go back</button>
                {{end}}
            </div>
            {{if .CanRetry}}<p class="error-help">Still stuck? <a href="/contact">Contact us</a> and mention error {{.Code}}.</p>{{end}}
        </div>
    </main>
    <script src="/static/js/error-page.js" defer></script>
</body>
</html>
