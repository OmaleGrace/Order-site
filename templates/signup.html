<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Gracie Ordering Site</title>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>

<body>
    <main>
        <div class="auth-wrapper">
            <h1>Create Your Account</h1>

            <form action="/signup" method="post">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group password-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
    <svg class="eye-icon eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="eye-icon eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
</button>
                </div>

                <button type="submit">Create Account</button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <a href="/auth/google" class="google-btn">
                <img src="/static/img/google-icon.svg" alt="" class="google-icon">
                Continue with Google
            </a>

            <p class="auth-footer">
                Already have an account? <a href="/login">Login</a>
            </p>

            <a href="/" class="back-link">← Back to Home</a>
        </div>
    </main>

    <script>
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.dataset.target);
            var isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';

            var openEye = btn.querySelector('.eye-open');
            var closedEye = btn.querySelector('.eye-closed');
            openEye.style.display = isHidden ? 'none' : 'block';
            closedEye.style.display = isHidden ? 'block' : 'none';

            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });
    });
</script>
    </script>
</body>
</html>
