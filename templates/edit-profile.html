<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Grace's Kitchen</title>

    <link rel="stylesheet" href="/static/css/account.css">
</head>

<body>

<header class="account-header">
    <div class="header-inner">

        <a href="/menu" class="logo">
            Grace's Kitchen
        </a>

        <nav>
            <a href="/menu">Menu</a>
            <a href="/cart">Cart</a>
            <a href="/orders">Orders</a>
            <a href="/account">Account</a>
            <a href="/logout">Logout</a>
        </nav>

    </div>
</header>

<main class="account-container">

    <section class="account-card">

        <h1>Edit Profile</h1>

        <form
            action="/account/edit"
            method="POST"
            enctype="multipart/form-data"
            class="profile-form"
        >

            <div class="profile-preview">

                {{if .ProfilePicture}}
                    <img
                        src="{{.ProfilePicture}}"
                        alt="Profile picture"
                        class="profile-image"
                    >
                {{else}}
                    <div class="profile-placeholder">
                        👤
                    </div>
                {{end}}

            </div>

            <label for="profile_picture">
                Profile picture
            </label>

            <input
                type="file"
                id="profile_picture"
                name="profile_picture"
                accept="image/jpeg,image/png,image/webp"
            >

            <small>
                JPG, PNG or WEBP. Maximum size: 5MB.
            </small>


            <label for="name">
                Username
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{.Name}}"
                maxlength="100"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                value="{{.Email}}"
                disabled
            >

            <small>
                Your email address cannot be changed here.
            </small>


            <div class="profile-buttons">

                <button type="submit">
                    Save Changes
                </button>

                <a href="/account">
                    Cancel
                </a>

            </div>

        </form>

        <div class="phone-section">

            <label for="current-phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="current-phone"
                value="{{.Phone}}"
                disabled
                placeholder="No phone number set"
            >

            <small>To add or change your phone number, verify a new one below.</small>

            <form action="/account/phone/send-otp" method="post" class="phone-form">
                <input
                    type="tel"
                    name="phone"
                    maxlength="20"
                    placeholder="e.g. 08012345678"
                    required
                >
                <button type="submit" class="send-code-btn">Send Code</button>
            </form>

        </div>

    </section>

</main>

</body>
</html>
