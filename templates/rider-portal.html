<!doctype html>
<html lang="en"><head>{{template "head-common"}}<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider delivery</title><style>body{font:16px system-ui;background:#f3f7f3;color:#173b2a;margin:0}.wrap{max-width:620px;margin:25px auto;padding:16px}.card{background:white;border:1px solid #dce8de;border-radius:18px;padding:20px;margin:14px 0}button,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd8ce}button{background:#14532d;color:white;border:0;cursor:pointer;width:100%;margin:6px 0}.secondary{background:#e7f2e9;color:#14532d}.status{font-weight:700;color:#14532d}</style></head><body><main class="wrap"><h1>Delivery partner</h1><p>Welcome, <strong>{{.RiderName}}</strong>. Order #{{.OrderID}}</p><section class="card"><h2>Delivery progress</h2><p class="status" id="current-status">{{.DeliveryStatus}}</p><label for="delivery-status">Update status</label><select id="delivery-status"><option value="picked_up">Picked up</option><option value="on_the_way">On the way</option><option value="arrived">Arrived</option><option value="delivered">Delivered</option></select><button id="save-status">Update delivery status</button><p id="status-result" aria-live="polite"></p></section><section class="card"><h2>Location sharing</h2><p>Location is shared only after you grant Chrome permission. You can stop sharing at any time.</p><button id="start-location">Start sharing my location</button><button class="secondary" id="stop-location">Stop sharing location</button><p id="location-result" aria-live="polite"></p></section></main><script>(function(){const token=location.pathname.split('/').pop();const post=async(path,data)=>{const body=new URLSearchParams(data||{});const r=await fetch('/rider/'+token+'/'+path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw new Error(await r.text());return r;};document.getElementById('save-status').onclick=async()=>{try{await post('status',{status:document.getElementById('delivery-status').value});document.getElementById('current-status').textContent=document.getElementById('delivery-status').selectedOptions[0].text;document.getElementById('status-result').textContent='Status updated.';}catch(e){document.getElementById('status-result').textContent='Could not update status. Refresh this page and try again.';}};let watch=null;let lastSent=0;const result=document.getElementById('location-result');document.getElementById('start-location').onclick=()=>{if(!navigator.geolocation){result.textContent='Location is not supported by this browser.';return;}if(watch!==null)return;result.textContent='Waiting for location permission…';watch=navigator.geolocation.watchPosition(async pos=>{if(Date.now()-lastSent<10000)return;lastSent=Date.now();try{await post('location',{latitude:String(pos.coords.latitude),longitude:String(pos.coords.longitude)});result.textContent='Your location is being shared.';}catch(e){result.textContent='Could not update location.';}},err=>{if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;}result.textContent=err.code===1?'Location permission was denied. Enable it in Chrome site settings if you choose to share.':'Could not get your location.';},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});};document.getElementById('stop-location').onclick=async()=>{if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;}try{await post('stop-location',{});result.textContent='Location sharing stopped.';}catch(e){result.textContent='Could not stop sharing. Please try again.';}};})();</script></body></html>
